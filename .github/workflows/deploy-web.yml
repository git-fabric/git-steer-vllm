name: Build & Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/git-fabric/git-steer-vllm-web
  DEPLOYMENT_NAME: git-steer-web
  CONTAINER_NAME: web
  NAMESPACE: git-steer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Configure SSH for private git-fabric deps
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "${{ secrets.GIT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install dependencies
        run: npm ci

      - name: Prepare .dockerignore for CI
        run: |
          # The default .dockerignore excludes node_modules at root, but
          # Dockerfile.web needs them in the build context for private deps.
          # Write a CI-specific .dockerignore that allows node_modules through.
          cat > .dockerignore <<'EOIGNORE'
          .git
          .github
          .env
          .env.*
          dist
          web/node_modules
          web/dist
          EOIGNORE
          # node_modules is intentionally NOT listed — it must be in the build context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to k3s
    needs: build-and-deploy
    # No self-hosted k3s runner is registered yet, and a job waiting for one is
    # cancelled after 24h. Until there is one, a fill-in runner takes the job
    # and the stub step below reports what would have been deployed. Set the
    # K3S_RUNNER_LABELS repo variable to ["self-hosted","k3s"] to deploy for real.
    runs-on: ${{ fromJSON(vars.K3S_RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Deploy (stub, no k3s runner yet)
        if: vars.K3S_RUNNER_LABELS == ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build-and-deploy.outputs.sha_short }}
        run: |
          echo "::notice title=Deploy stubbed::No k3s runner registered (K3S_RUNNER_LABELS unset). Would deploy $IMAGE_REF to deployment/${{ env.DEPLOYMENT_NAME }} in ${{ env.NAMESPACE }}."

      - name: Install kubectl
        if: vars.K3S_RUNNER_LABELS != ''
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi

      - name: Configure kubectl
        if: vars.K3S_RUNNER_LABELS != ''
        run: |
          # Use the service account token mounted in the pod
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          KUBE_CA=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
          KUBE_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          kubectl config set-cluster k3s --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials runner --token=$KUBE_TOKEN
          kubectl config set-context default --cluster=k3s --user=runner --namespace=$KUBE_NS
          kubectl config use-context default

      - name: Deploy
        if: vars.K3S_RUNNER_LABELS != ''
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}=${{ env.IMAGE }}:${{ needs.build-and-deploy.outputs.sha_short }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=120s
