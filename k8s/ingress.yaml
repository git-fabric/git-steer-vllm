apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git-steer-ui
  namespace: fabric
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: cloudflare
spec:
  tls:
    - hosts:
        - git-steer.ry-ops.dev
      secretName: git-steer-ui-tls
  rules:
    - host: git-steer.ry-ops.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-steer-ui
                port:
                  name: http
