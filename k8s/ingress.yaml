apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git-steer-ui
  namespace: fabric
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: steer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git-steer-ui
                port:
                  name: http
